<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings | Dream Destinations</title>

<link rel="stylesheet"
href="../css/settings.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="admin-container">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

<div class="logo">

<h2>Dream Destinations</h2>

</div>

<ul>

<li>
<a href="dashboard.html">
<i class="fa-solid fa-gauge"></i>
Dashboard
</a>
</li>

<li>
<a href="manage-packages.html">
<i class="fa-solid fa-box-open"></i>
Manage Packages
</a>
</li>

<li>
<a href="manage-bookings.html">
<i class="fa-solid fa-calendar-check"></i>
Manage Bookings
</a>
</li>

<li>
<a href="manage-users.html">
<i class="fa-solid fa-users"></i>
Manage Users
</a>
</li>

<li>
<a href="reports.html">
<i class="fa-solid fa-chart-line"></i>
Reports
</a>
</li>

<li class="Active">
<a href="settings.html">
<i class="fa-solid fa-gear"></i>
Settings
</a>
</li>

<li>
<a href="admin-login.html">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a>
</li>

</ul>

</aside>

<!-- ================= CONTENT ================= -->

<main class="content">

<div class="topbar">

<h1>

<i class="fa-solid fa-gear"></i>

Settings

</h1>

</div>

<!-- ================= ADMIN PROFILE ================= -->

<div class="settings-card">

<h2>

<i class="fa-solid fa-user"></i>

Admin Profile

</h2>

<div class="form-grid">

<div class="form-group">

<label>Admin Name</label>

<input
type="text"
id="adminName"
placeholder="Enter Name">

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="adminEmail"
placeholder="Enter Email">

</div>

<div class="form-group">

<label>Phone</label>

<input
type="text"
id="adminPhone"
placeholder="Enter Phone">

</div>

<div class="form-group">

<label>Profile Image</label>

<input
type="file"
id="profileImage">

</div>

</div>

</div>

<!-- ================= CHANGE PASSWORD ================= -->

<div class="settings-card">

    <h2>

        <i class="fa-solid fa-lock"></i>

        Change Password

    </h2>

    <div class="form-grid">

        <div class="form-group">

            <label>Current Password</label>

            <input
                type="password"
                id="currentPassword"
                placeholder="Enter Current Password">

        </div>

        <div class="form-group">

            <label>New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter New Password">

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password">

        </div>

    </div>

</div>


<!-- ================= WEBSITE SETTINGS ================= -->

<div class="settings-card">

    <h2>

        <i class="fa-solid fa-globe"></i>

        Website Settings

    </h2>

    <div class="form-grid">

        <div class="form-group">

            <label>Website Name</label>

            <input
                type="text"
                id="websiteName"
                placeholder="Dream Destinations">

        </div>

        <div class="form-group">

            <label>Website Tagline</label>

            <input
                type="text"
                id="websiteTagline"
                placeholder="Explore the World">

        </div>

        <div class="form-group">

            <label>Contact Email</label>

            <input
                type="email"
                id="contactEmail"
                placeholder="support@example.com">

        </div>

        <div class="form-group">

            <label>Contact Phone</label>

            <input
                type="text"
                id="contactPhone"
                placeholder="+91 XXXXXXXXXX">

        </div>

        <div class="form-group full-width">

            <label>Office Address</label>

            <textarea
                id="officeAddress"
                rows="4"
                placeholder="Enter Office Address"></textarea>

        </div>

    </div>

</div>

<!-- ================= SOCIAL MEDIA ================= -->

<div class="settings-card">

    <h2>

        <i class="fa-solid fa-share-nodes"></i>

        Social Media

    </h2>

    <div class="form-grid">

        <div class="form-group">

            <label>Facebook</label>

            <input
                type="url"
                id="facebook"
                placeholder="https://facebook.com/">

        </div>

        <div class="form-group">

            <label>Instagram</label>

            <input
                type="url"
                id="instagram"
                placeholder="https://instagram.com/">

        </div>

        <div class="form-group">

            <label>X (Twitter)</label>

            <input
                type="url"
                id="twitter"
                placeholder="https://x.com/">

        </div>

        <div class="form-group">

            <label>YouTube</label>

            <input
                type="url"
                id="youtube"
                placeholder="https://youtube.com/">

        </div>

    </div>

</div>

<!-- ================= LOGO & FAVICON ================= -->

<div class="settings-card">

    <h2>

        <i class="fa-solid fa-image"></i>

        Logo & Branding

    </h2>

    <div class="form-grid">

        <div class="form-group">

            <label>Website Logo</label>

            <input
                type="file"
                id="websiteLogo">

        </div>

        <div class="form-group">

            <label>Website Favicon</label>

            <input
                type="file"
                id="websiteFavicon">

        </div>

    </div>

</div>

<!-- ================= SAVE BUTTON ================= -->

<div class="save-section">

    <button id="saveSettings">

        <i class="fa-solid fa-floppy-disk"></i>

        Save Settings

    </button>

</div>

</main>

</div>

<script src="../js/settings.js"></script>

</body>

</html>
