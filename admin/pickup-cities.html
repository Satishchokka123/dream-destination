<!-- ===========================
Main Content
=========================== -->

<div class="main-content">

<div class="page-header">

<h1>

Pickup Cities

</h1>

<button id="addCityBtn">

<i class="fa-solid fa-plus"></i>

Add City

</button>

</div>

<!-- ===========================
Search
=========================== -->

<div class="search-box">

<input
type="text"
id="searchCity"
placeholder="Search City...">

<i class="fa-solid fa-magnifying-glass"></i>

</div>

<!-- ===========================
Cities Table
=========================== -->

<div class="table-container">

<table>

<thead>

<tr>

<th>ID</th>

<th>City Name</th>

<th>Charge</th>

<th>Status</th>

<th>Created</th>

<th>Action</th>

</tr>

</thead>

<tbody id="citiesTable">

<!-- Dynamic -->

</tbody>

</table>

</div>

<!-- ===========================
Add / Edit Modal
=========================== -->

<div class="modal" id="cityModal">

    <div class="modal-content">

        <h2 id="modalTitle">

            Add Pickup City

        </h2>

        <form id="cityForm">

            <input
            type="hidden"
            id="cityId">

            <div class="form-group">

                <label>

                    City Name

                </label>

                <input
                type="text"
                id="cityName"
                required>

            </div>

            <div class="form-group">

                <label>

                    Pickup Charge (₹)

                </label>

                <input
                type="number"
                id="cityCharge"
                required>

            </div>

            <div class="form-group">

                <label>

                    Status

                </label>

                <select id="cityStatus">

                    <option value="Active">

                        Active

                    </option>

                    <option value="Inactive">

                        Inactive

                    </option>

                </select>

            </div>

            <div class="modal-buttons">

                <button
                type="submit"
                class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save

                </button>

                <button
                type="button"
                id="closeModal"
                class="cancel-btn">

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>

</div>

</div>

<script src="../js/pickup-cities.js"></script>

</body>
