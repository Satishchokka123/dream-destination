    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="main-content">

        <div class="page-header">

            <h1>

                Extra Services

            </h1>

            <button id="addServiceBtn">

                <i class="fa-solid fa-plus"></i>

                Add Service

            </button>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-box">

            <input

                type="text"

                id="searchService"

                placeholder="Search Service">

            <i class="fa-solid fa-magnifying-glass"></i>

        </div>


        <!-- =========================
             TABLE
        ========================== -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Service Name</th>

                        <th>Charge</th>

                        <th>Charge Type</th>

                        <th>Status</th>

                        <th>Created</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="serviceTable">

                    <!-- Dynamic Data -->

                </tbody>

            </table>

        </div>

    </div>

</div>
<!-- =========================
     ADD / EDIT SERVICE MODAL
========================== -->

<div class="modal" id="serviceModal">

    <div class="modal-content">

        <h2 id="modalTitle">

            Add Extra Service

        </h2>

        <form id="serviceForm">

            <input
                type="hidden"
                id="serviceId">


            <!-- Service Name -->

            <div class="form-group">

                <label>

                    Service Name

                </label>

                <input
                    type="text"
                    id="serviceName"
                    placeholder="Breakfast / Insurance / Sightseeing"
                    required>

            </div>


            <!-- Charge -->

            <div class="form-group">

                <label>

                    Charge (₹)

                </label>

                <input
                    type="number"
                    id="serviceCharge"
                    min="0"
                    step="0.01"
                    placeholder="Enter charge"
                    required>

            </div>


            <!-- Charge Type -->

            <div class="form-group">

                <label>

                    Charge Type

                </label>

                <select id="serviceChargeType" required>

                    <option value="Per Person">

                        Per Person

                    </option>

                    <option value="Fixed">

                        Fixed

                    </option>

                </select>

            </div>


            <!-- Status -->

            <div class="form-group">

                <label>

                    Status

                </label>

                <select id="serviceStatus">

                    <option value="Active">

                        Active

                    </option>

                    <option value="Inactive">

                        Inactive

                    </option>

                </select>

            </div>


            <!-- Buttons -->

            <div class="modal-buttons">

                <button
                    type="submit"
                    class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save

                </button>


                <button
                    type="button"
                    id="closeModal"
                    class="cancel-btn">

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="../js/extra-services.js"></script>

</body>
