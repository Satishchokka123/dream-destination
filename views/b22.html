<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Triangle Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #0b5ed7, #1e90ff);
    padding: 40px;
}

.booking-container {
    max-width: 500px;
    background: #fff;
    margin: auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.booking-container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #0b5ed7;
}

label {
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.total {
    font-size: 18px;
    margin-bottom: 15px;
    color: green;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 12px;
    background: #0b5ed7;
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #084298;
}
</style>
</head>

<body>

<div class="booking-container">
    <h2> Booking Station</h2>

    <form onsubmit="return bookTour()">

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" required>

        <label>Number of Persons</label>
        <input type="number" id="persons" min="1" value="1" onchange="calculate()" required>

        <label>Travel Date</label>
        <input type="date" id="date" required>

        <label>Hotel Type</label>
        <select id="hotel" onchange="calculate()">
            <option value="7000">Standard</option>
            <option value="9000">Deluxe</option>
            <option value="14000">Luxury</option>
        </select>

        <div class="total">
            Total Price: ₹ <span id="total">18000</span>
        </div>

        <button type="submit">Confirm Booking</button>

    </form>
</div>

<script>
const basePrice = 18000;

function calculate() {
    let persons = document.getElementById("persons").value;
    let hotel = document.getElementById("hotel").value;

    let total = (basePrice + parseInt(hotel)) * persons;
    document.getElementById("total").innerText = total;
}

function bookTour() {
    let name = document.getElementById("name").value;

    alert(
        "Booking Successful!\n\n" +
        "Package: Ooty hill Station\n" +
        "Name: " + name + "\n" +
        "Our team will contact you shortly."
    );

    return false; // prevents page refresh
}
</script>

</body>
</html>
