<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
background-size:100% 100%;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.container{

width:420px;
padding:35px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.35);
color:white;
text-align:center;

}

.container h2{

font-size:30px;
margin-bottom:10px;

}

.container p{

margin-bottom:25px;
opacity:.9;

}

.input-box{

margin-bottom:15px;
position:relative;

}

.input-box input{

width:100%;
padding:14px;
border:none;
outline:none;
border-radius:30px;
background:rgba(255,255,255,.2);
color:white;
font-size:15px;

}

.input-box input::placeholder{

color:white;

}

.eye{

position:absolute;
right:18px;
top:15px;
cursor:pointer;
font-size:18px;

}

.otp-box{

display:flex;
gap:10px;

}

.otp-box input{

flex:1;

}

.otp-box button{

padding:12px 15px;
border:none;
border-radius:30px;
cursor:pointer;
background:#FFD700;
font-weight:bold;

}

button.register{

width:100%;
padding:14px;
border:none;
border-radius:30px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
background:white;
color:#2575fc;
transition:.3s;

}

button.register:hover{

background:#2575fc;
color:white;
transform:translateY(-3px);

}

#message{

margin-top:18px;
font-weight:bold;

}

a{

color:#FFD700;
text-decoration:none;

}

</style>

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<form id="registerForm" >

<div class="input-box">
<input type="text" id="name" placeholder="Full Name" required>
</div>

<div class="input-box">
<input type="email" id="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="phone" id="phone" placeholder="Mobile Number" required>
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Password" required>
<span class="eye" onclick="togglePassword()">👁</span>
</div>



<button class="register" type="submit">
Create 
</button>

</form>

<div id="message"></div>

<br>

<p>Already have an account?
<a href="l1.html">Login</a>
</p>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;

    fetch("http://localhost:3000/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            email: email,
            phone: phone,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message);

        if (data.success) {
            window.location.href = "Dream.html";
        }
    })
    .catch(error => {
        console.error(error);
    });

});
</script>

</body>
</html>
