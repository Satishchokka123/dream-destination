<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Package Details | Dream Destinations</title>

<link rel="stylesheet" href="../css/package-details.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Header -->

<header class="header">

    <div class="logo">

        Dream Destinations

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="package.html">Packages</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>

<!-- Main -->

<section class="details-section">

<div class="details-card">

<div class="image-box">

<img id="packageImage">

</div>

<div class="content-box">

<span class="category" id="packageCategory">

Category

</span>

<h1 id="packageName">

Package Name

</h1>

<p class="destination">

<i class="fa-solid fa-location-dot"></i>

<span id="packageDestination"></span>

</p>

<div class="info-grid">

<div class="info-item">

<i class="fa-solid fa-clock"></i>

<div>

<h4>Duration</h4>

<p id="packageDuration"></p>

</div>

</div>

<div class="info-item">

<i class="fa-solid fa-money-bill-wave"></i>

<div>

<h4>Price</h4>

<p>

₹<span id="packagePrice"></span>

</p>

</div>

</div>

</div>

<div class="description">

<h3>

Description

</h3>

<p id="packageDescription">

</p>

</div>

<div class="includes">

<h3>

Package Includes

</h3>

<ul>

<li>

<i class="fa-solid fa-check"></i>

Hotel Stay

</li>

<li>

<i class="fa-solid fa-check"></i>

Transportation

</li>

<li>

<i class="fa-solid fa-check"></i>

Sightseeing

</li>

<li>

<i class="fa-solid fa-check"></i>

Breakfast

</li>

</ul>

</div>

<div class="buttons">

<a id="bookNowBtn"

class="book-btn">

Book Now

</a>

<a href="package.html"

class="back-btn">

Back

</a>

</div>

</div>

</div>

</section>

<script src="../js/package-details.js"></script>

</body>

</html>
